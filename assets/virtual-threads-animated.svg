<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><defs><style>.bg{fill:#0d1117}.box{fill:#161b22;stroke-width:3}.t{font:700 24px Arial,sans-serif;fill:#f0f6fc}.s{font:17px Arial,sans-serif;fill:#8b949e}.line{stroke:#8b949e;stroke-width:5;fill:none;stroke-linecap:round}.step{font:16px Arial,sans-serif;fill:#f0f6fc}</style><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="1000" height="420" rx="20"/><text x="36" y="46" class="t">Virtual Threads: o trabalho se move, a carrier é reutilizada</text><text x="36" y="76" class="s">A bolinha representa uma requisição atravessando a JVM.</text><rect x="40" y="155" width="160" height="86" rx="16" class="box" stroke="#58a6ff"/><text x="83" y="207" class="t">Request</text><rect x="260" y="155" width="175" height="86" rx="16" class="box" stroke="#a371f7"/><text x="280" y="207" class="t">Virtual Thread</text><rect x="500" y="145" width="190" height="106" rx="16" class="box" stroke="#39d2c0"/><text x="515" y="207" class="t">JVM Scheduler</text><rect x="760" y="82" width="190" height="82" rx="16" class="box" stroke="#3fb950"/><text x="783" y="131" class="t">Carrier + CPU</text><rect x="760" y="267" width="190" height="82" rx="16" class="box" stroke="#d29922"/><text x="787" y="316" class="t">Esperando I/O</text><path d="M200 198 H260" class="line"/><path d="M435 198 H500" class="line"/><path d="M690 198 L760 123" class="line"/><path d="M690 208 L760 308" class="line"/><circle r="13" fill="#58a6ff" stroke="#fff" stroke-width="2" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M200 198 H260 H435 H500 H690 L760 123 H930"/></circle><circle r="11" fill="#d29922" stroke="#fff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.9;1" dur="6s" repeatCount="indefinite"/><animateMotion dur="6s" repeatCount="indefinite" path="M690 208 L760 308 H920"/></circle><circle r="12" fill="#3fb950" stroke="#fff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.72;0.98;1" dur="6s" repeatCount="indefinite"/><animateMotion begin="4.2s" dur="1.6s" repeatCount="indefinite" path="M260 198 H435 H500 H690 L760 123 H900"/></circle><rect x="35" y="367" width="930" height="38" rx="10" fill="#161b22"/><text x="58" y="392" class="step">Quando uma Virtual Thread espera I/O, a JVM pode liberar a carrier para outra tarefa.</text></svg>