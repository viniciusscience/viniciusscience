<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><defs><style>.bg{fill:#0d1117}.box{fill:#161b22;stroke-width:3}.t{font:700 24px Arial,sans-serif;fill:#f0f6fc}.s{font:17px Arial,sans-serif;fill:#8b949e}.line{stroke:#8b949e;stroke-width:5;fill:none;stroke-linecap:round}.warn{font:700 28px Arial,sans-serif;fill:#f85149}</style><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect class="bg" width="1000" height="420" rx="20"/><text x="36" y="46" class="t">Deadlock: cada thread espera um lock que nunca será liberado</text><text x="36" y="76" class="s">A animação monta o ciclo de espera passo a passo.</text><rect x="55" y="125" width="175" height="78" rx="16" class="box" stroke="#58a6ff"/><text x="89" y="173" class="t">Thread A</text><rect x="55" y="265" width="175" height="78" rx="16" class="box" stroke="#a371f7"/><text x="89" y="313" class="t">Thread B</text><rect x="390" y="115" width="175" height="78" rx="16" class="box" stroke="#3fb950"/><text x="432" y="163" class="t">Lock A</text><rect x="390" y="275" width="175" height="78" rx="16" class="box" stroke="#d29922"/><text x="432" y="323" class="t">Lock B</text><path d="M230 164 H390" class="line"/><path d="M230 304 H390" class="line"/><path d="M230 164 L390 314" stroke="#f85149" stroke-width="5" fill="none" stroke-dasharray="8 8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.5;1" dur="6s" repeatCount="indefinite"/></path><path d="M230 304 L390 154" stroke="#f85149" stroke-width="5" fill="none" stroke-dasharray="8 8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.72;1" dur="6s" repeatCount="indefinite"/></path><circle r="12" fill="#58a6ff" stroke="#fff" stroke-width="2"><animateMotion dur="1.3s" repeatCount="indefinite" path="M230 164 H380"/></circle><circle r="12" fill="#a371f7" stroke="#fff" stroke-width="2"><animateMotion begin="1.5s" dur="1.3s" repeatCount="indefinite" path="M230 304 H380"/></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.78;0.95;1" dur="6s" repeatCount="indefinite"/><rect x="690" y="155" width="255" height="120" rx="18" fill="#2d0d12" stroke="#f85149" stroke-width="4" filter="url(#glow)"/><text x="743" y="212" class="warn">DEADLOCK</text><text x="727" y="244" class="s" fill="#f0f6fc">ninguém consegue progredir</text></g><rect x="35" y="368" width="930" height="37" rx="10" fill="#161b22"/><text x="58" y="392" class="s">Thread A segura Lock A e espera B; Thread B segura Lock B e espera A → ciclo fechado.</text></svg>