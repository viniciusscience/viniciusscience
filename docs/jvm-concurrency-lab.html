<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JVM Concurrency Lab</title><style>body{font-family:Inter,system-ui;background:#0d1117;color:#f0f6fc;margin:0;padding:24px}main{max-width:1000px;margin:auto}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button,select{background:#21262d;color:#f0f6fc;border:1px solid #30363d;border-radius:8px;padding:10px 14px}.stage{position:relative;height:360px;border:1px solid #30363d;border-radius:16px;background:#161b22;overflow:hidden}.node{position:absolute;padding:18px 20px;border:2px solid #58a6ff;border-radius:14px;background:#0d1117}.request{left:40px;top:140px}.vt{left:250px;top:140px;border-color:#a371f7}.scheduler{left:480px;top:130px;border-color:#39d2c0}.carrier{right:40px;top:70px;border-color:#3fb950}.io{right:40px;bottom:55px;border-color:#d29922}.dot{position:absolute;width:24px;height:24px;border-radius:50%;background:#58a6ff;box-shadow:0 0 18px #58a6ff;left:180px;top:165px;transition:all .9s ease}.explain{margin-top:18px;padding:14px 16px;border-radius:10px;background:#161b22;border:1px solid #30363d}.deadlock .node{border-color:#f85149}.lockA{left:410px;top:75px}.lockB{left:410px;bottom:70px}.threadA{left:55px;top:75px}.threadB{left:55px;bottom:70px}.dead{position:absolute;right:70px;top:135px;padding:30px;border:2px solid #f85149;border-radius:14px;color:#f85149;font-weight:700;opacity:0;transition:opacity .4s}.arrow{position:absolute;height:4px;background:#8b949e;transform-origin:left center}.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{from{box-shadow:0 0 8px #f85149}to{box-shadow:0 0 28px #f85149}}</style></head><body><main><h1>JVM Concurrency Lab</h1><p>Uma visualização simples para entender Virtual Threads, I/O e deadlock.</p><div class="controls"><select id="scenario"><option value="virtual">Virtual Threads</option><option value="deadlock">Deadlock</option></select><button id="play">▶ Play</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage"></div><div id="explain" class="explain">Escolha um cenário e clique em Play.</div></main><script>const stage=document.getElementById('stage'),explain=document.getElementById('explain'),scenario=document.getElementById('scenario');let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));function clear(){timers.forEach(clearTimeout);timers=[];stage.innerHTML='';stage.className='stage';explain.textContent='Pronto.'}function node(cls,text){const e=document.createElement('div');e.className='node '+cls;e.textContent=text;stage.appendChild(e);return e}function virtual(){clear();node('request','Request');node('vt','Virtual Thread');node('scheduler','JVM Scheduler');node('carrier','Carrier + CPU');node('io','Esperando I/O');const d=document.createElement('div');d.className='dot';stage.appendChild(d);explain.textContent='1) Chega uma requisição.';later(()=>{d.style.left='365px';explain.textContent='2) A requisição vira uma Virtual Thread.'},900);later(()=>{d.style.left='610px';explain.textContent='3) O scheduler escolhe uma carrier thread.'},1800);later(()=>{d.style.left='840px';d.style.top='95px';d.style.background='#3fb950';explain.textContent='4) A carrier executa na CPU.'},2700);later(()=>{d.style.top='270px';d.style.background='#d29922';explain.textContent='5) Entrou em I/O: a Virtual Thread pode desmontar e liberar a carrier.'},3700);later(()=>{const d2=document.createElement('div');d2.className='dot';d2.style.background='#3fb950';stage.appendChild(d2);later(()=>d2.style.left='610px',50);later(()=>{d2.style.left='840px';d2.style.top='95px';explain.textContent='6) Outra Virtual Thread usa a carrier enquanto a primeira espera I/O.'},900)},4700)}function deadlock(){clear();stage.classList.add('deadlock');node('threadA','Thread A');node('threadB','Thread B');node('lockA','Lock A');node('lockB','Lock B');const dead=document.createElement('div');dead.className='dead';dead.textContent='DEADLOCK';stage.appendChild(dead);explain.textContent='1) Thread A pega Lock A.';later(()=>{explain.textContent='2) Thread B pega Lock B.'},1300);later(()=>{explain.textContent='3) Thread A tenta Lock B, mas ele está ocupado.'},2600);later(()=>{explain.textContent='4) Thread B tenta Lock A. Agora cada uma espera a outra.'},3900);later(()=>{dead.style.opacity='1';dead.classList.add('pulse');explain.textContent='5) Ciclo de espera detectado: ninguém progride.'},5000)}document.getElementById('play').onclick=()=>scenario.value==='virtual'?virtual():deadlock();document.getElementById('reset').onclick=clear;clear();</script></body></html>
